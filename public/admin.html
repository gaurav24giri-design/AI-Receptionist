<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Receptionist - Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 24px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 7px 0 0;
            color: #d1d5db;
        }

        .container {
            max-width: 1150px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            transition: 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-card h2 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .stat-card p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        .search-box input:focus {
            border-color: #111827;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            background: #111827;
            color: white;
            font-size: 14px;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }

        .result-info {
            margin-bottom: 15px;
            color: #666;
            font-size: 14px;
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-card {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            border-left: 5px solid #22c55e;
            transition: 0.2s;
        }

        .message-card:hover {
            transform: translateY(-2px);
        }

        .message-card.urgent {
            border-left-color: #ef4444;
            background: #fffafa;
        }

        .message-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
        }

        .message-title {
            font-size: 16px;
            font-weight: bold;
        }

        .badge {
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .urgent-badge {
            background: #fee2e2;
            color: #b91c1c;
        }

        .normal-badge {
            background: #dcfce7;
            color: #166534;
        }

        .customer-details {
            margin-top: 18px;
            padding: 16px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
        }

        .customer-details-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #111827;
        }

        .customer-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .info-item {
            background: white;
            padding: 11px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            min-width: 0;
        }

        .info-label {
            display: block;
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .info-value {
            font-size: 14px;
            color: #111827;
            word-break: break-word;
        }

        .customer-message {
            font-size: 17px;
            line-height: 1.6;
            margin: 15px 0;
            word-wrap: break-word;
        }

        .ai-reply {
            background: #f3f4f6;
            padding: 14px;
            border-radius: 9px;
            color: #444;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .date {
            color: #777;
            font-size: 13px;
            margin-top: 12px;
        }

        .delete-btn {
            background: #dc2626;
            margin-top: 12px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .empty {
            background: white;
            padding: 45px;
            text-align: center;
            border-radius: 14px;
            color: #777;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .error {
            background: #fff1f2;
            color: #b91c1c;
            border: 1px solid #fecdd3;
        }

        @media (max-width: 700px) {

            header {
                padding: 20px;
            }

            header h1 {
                font-size: 23px;
            }

            .container {
                margin: 20px auto;
                padding: 0 14px;
            }

            .stats {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .toolbar {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .toolbar button {
                width: 100%;
            }

            .message-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .customer-info {
                grid-template-columns: 1fr;
            }

            .customer-message {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>

<header>

    <h1>🤖 AI Receptionist</h1>

    <p>Admin Messages Dashboard</p>

</header>


<div class="container">

    <div class="stats">

        <div class="stat-card">

            <h2 id="totalMessages">0</h2>

            <p>📩 Total Messages</p>

        </div>


        <div class="stat-card">

            <h2 id="urgentMessages">0</h2>

            <p>🔴 Urgent Messages</p>

        </div>


        <div class="stat-card">

            <h2 id="normalMessages">0</h2>

            <p>🟢 Normal Messages</p>

        </div>

    </div>


    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search name, phone, email, message..."
            oninput="searchMessages()"
        >

    </div>


    <div class="toolbar">

        <button onclick="loadMessages()">
            🔄 Refresh
        </button>

        <button onclick="showAll()">
            📩 All
        </button>

        <button onclick="showUrgent()">
            🔴 Urgent
        </button>

        <button onclick="showNormal()">
            🟢 Normal
        </button>

    </div>


    <div
        id="resultInfo"
        class="result-info">
    </div>


    <div
        id="messages"
        class="messages">
    </div>

</div>


<script>

const API_BASE_URL =
    "https://ai-receptionist-backend.gaurav24giri.workers.dev";

let allMessages = [];

let currentFilter = "all";


// ========================================
// LOAD MESSAGES FROM CLOUDFLARE D1
// ========================================

async function loadMessages() {

    try {

        const response =
            await fetch(
                `${API_BASE_URL}/api/messages`
            );

        if (!response.ok) {

            throw new Error(
                `HTTP error: ${response.status}`
            );

        }

        const data =
            await response.json();

        if (!data.success) {

            throw new Error(
                data.error ||
                "Unable to load messages"
            );

        }

        allMessages =
            data.messages || [];

        updateStats();

        applyCurrentView();

    } catch (error) {

        console.error(
            "Load messages error:",
            error
        );

        document.getElementById(
            "messages"
        ).innerHTML = `

            <div class="empty error">

                ❌ Unable to load messages.

                <br><br>

                Please try refreshing the page.

            </div>

        `;

    }

}


// ========================================
// UPDATE STATS
// ========================================

function updateStats() {

    const total =
        allMessages.length;

    const urgent =
        allMessages.filter(
            message =>
                Number(message.urgent) === 1 ||
                message.urgent === true
        ).length;

    const normal =
        total - urgent;

    document.getElementById(
        "totalMessages"
    ).textContent = total;

    document.getElementById(
        "urgentMessages"
    ).textContent = urgent;

    document.getElementById(
        "normalMessages"
    ).textContent = normal;

}


// ========================================
// APPLY FILTER + SEARCH
// ========================================

function applyCurrentView() {

    let messages =
        [...allMessages];


    if (currentFilter === "urgent") {

        messages =
            messages.filter(
                message =>
                    Number(message.urgent) === 1 ||
                    message.urgent === true
            );

    }


    if (currentFilter === "normal") {

        messages =
            messages.filter(
                message =>
                    Number(message.urgent) !== 1 &&
                    message.urgent !== true
            );

    }


    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const searchText =
        searchInput.value
            .trim()
            .toLowerCase();


    if (searchText !== "") {

        messages =
            messages.filter(
                message => {

                    const name =
                        String(
                            message.name || ""
                        ).toLowerCase();

                    const phone =
                        String(
                            message.phone || ""
                        ).toLowerCase();

                    const email =
                        String(
                            message.email || ""
                        ).toLowerCase();

                    const customerMessage =
                        String(
                            message.message || ""
                        ).toLowerCase();

                    const aiReply =
                        String(
                            message.reply || ""
                        ).toLowerCase();


                    return (

                        name.includes(searchText) ||

                        phone.includes(searchText) ||

                        email.includes(searchText) ||

                        customerMessage.includes(searchText) ||

                        aiReply.includes(searchText)

                    );

                }
            );

    }


    displayMessages(messages);

}


// ========================================
// DISPLAY MESSAGES
// ========================================

function displayMessages(messages) {

    const container =
        document.getElementById(
            "messages"
        );

    const resultInfo =
        document.getElementById(
            "resultInfo"
        );


    resultInfo.textContent =
        `${messages.length} message(s) found`;


    if (messages.length === 0) {

        container.innerHTML = `

            <div class="empty">

                📭 No messages found.

            </div>

        `;

        return;

    }


    container.innerHTML =
        messages
            .map(message => {

                const urgent =
                    Number(message.urgent) === 1 ||
                    message.urgent === true;


                const date =
                    message.created_at
                        ? new Date(
                            message.created_at
                        ).toLocaleString()
                        : "Date not available";


                const customerName =
                    message.name ||
                    "Not provided";


                const customerPhone =
                    message.phone ||
                    "Not provided";


                const customerEmail =
                    message.email ||
                    "Not provided";


                return `

                    <div class="message-card ${
                        urgent
                            ? "urgent"
                            : ""
                    }">


                        <div class="message-top">

                            <div class="message-title">

                                ${
                                    urgent
                                        ? "🚨 Urgent Customer Message"
                                        : "💬 Customer Message"
                                }

                            </div>


                            <span class="badge ${
                                urgent
                                    ? "urgent-badge"
                                    : "normal-badge"
                            }">

                                ${
                                    urgent
                                        ? "🔴 URGENT"
                                        : "🟢 NORMAL"
                                }

                            </span>

                        </div>


                        <div class="customer-details">

                            <div class="customer-details-title">

                                👤 Customer Details

                            </div>


                            <div class="customer-info">


                                <div class="info-item">

                                    <span class="info-label">
                                        Name
                                    </span>

                                    <span class="info-value">

                                        ${escapeHTML(
                                            customerName
                                        )}

                                    </span>

                                </div>


                                <div class="info-item">

                                    <span class="info-label">
                                        Phone
                                    </span>

                                    <span class="info-value">

                                        ${escapeHTML(
                                            customerPhone
                                        )}

                                    </span>

                                </div>


                                <div class="info-item">

                                    <span class="info-label">
                                        Email
                                    </span>

                                    <span class="info-value">

                                        ${escapeHTML(
                                            customerEmail
                                        )}

                                    </span>

                                </div>


                            </div>

                        </div>


                        <div class="customer-message">

                            <strong>
                                💬 Message
                            </strong>

                            <br><br>

                            ${escapeHTML(
                                message.message || ""
                            )}

                        </div>


                        <div class="ai-reply">

                            <strong>
                                🤖 AI Reply
                            </strong>

                            <br><br>

                            ${escapeHTML(
                                message.reply || ""
                            )}

                        </div>


                        <div class="date">

                            🕒 ${escapeHTML(date)}

                        </div>


                        <button
                            class="delete-btn"
                            onclick="deleteMessage(${message.id})">

                            🗑️ Delete Message

                        </button>


                    </div>

                `;

            })
            .join("");

}


// ========================================
// SEARCH
// ========================================

function searchMessages() {

    applyCurrentView();

}


// ========================================
// FILTERS
// ========================================

function showAll() {

    currentFilter = "all";

    applyCurrentView();

}


function showUrgent() {

    currentFilter = "urgent";

    applyCurrentView();

}


function showNormal() {

    currentFilter = "normal";

    applyCurrentView();

}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(text);

    return div.innerHTML;

}


// ========================================
// DELETE MESSAGE
// ========================================

async function deleteMessage(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this message?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API_BASE_URL}/api/messages/${id}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            alert(
                "Unable to delete message."
            );

            return;

        }


        await loadMessages();


    } catch (error) {

        console.error(
            "Delete error:",
            error
        );

        alert(
            "Something went wrong."
        );

    }

}


// ========================================
// INITIAL LOAD
// ========================================

loadMessages();

</script>


</body>

</html>
